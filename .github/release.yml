# Sections for the release notes GitHub writes when a release is created (the "Generate release
# notes" button, and the release workflow). Each merged pull request goes under the first
# section whose label it carries; pull requests with no matching label go under "Other changes".
# https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: New features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
