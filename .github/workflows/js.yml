name: JS packages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: js

jobs:
  build:
    name: Build and test JS packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke-test the built core package
        run: >-
          node --input-type=module -e "
          import { toBs, toAd, formatBs } from '@opensourcenepal/nepali-calendar';
          const bs = toBs({ year: 2025, month: 10, day: 2 });
          if (formatBs(bs, 'D', 'nepali') !== '१६ असोज २०८२') throw new Error(formatBs(bs, 'D', 'nepali'));
          if (toAd(bs).day !== 2) throw new Error('round trip');
          console.log('ok', formatBs(bs, 'F'));"

      - name: Pack
        run: |
          mkdir -p ../artifacts
          npm pack --workspace packages/core --workspace packages/react --pack-destination ../artifacts
          npm pack ./packages/angular/dist --pack-destination ../artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: artifacts/*.tgz
